<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push Media HR · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script src="config.js"></script>
<style>
/* สี Push Media ขาว–ดำ ตามโลโก้ (22 ต.ค. 2569) · สีสถานะ ok/warn/bad คงไว้ */
:root{--nav:#0B0B0B;--nav2:#1F1F1F;--nav-ink:#C8C8C8;--acc:#111111;--acc-soft:#EDEDED;--bg:#F4F4F4;--sf:#FFFFFF;--sf2:#F8F8F8;--line:#E3E3E3;
 --fg:#141414;--mut:#5F5F5F;--fnt:#909090;--ok:#1A8A4A;--ok-s:#E3F4EA;--warn:#B26A00;--warn-s:#FFF3DC;--bad:#C0392B;--bad-s:#FCE8E6;--info:#3A3A3A;--info-s:#EDEDED;
 --sans:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--r:10px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--mut)}.faint{color:var(--fnt)}
/* shell */
.shell{display:flex;min-height:100%}
.side{width:232px;flex:none;background:var(--nav);color:var(--nav-ink);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;padding:4px 8px 16px}
.brand i{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--nav);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:inherit;text-decoration:none;cursor:pointer}
.side a:hover{background:var(--nav2)}.side a.on{background:var(--nav2);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.side a .cnt{margin-left:auto;background:var(--warn);color:#fff;font-size:11px;border-radius:99px;padding:0 7px}
.side .who{margin-top:auto;padding:10px;font-size:12.5px}.side .who b{display:block;color:#fff;font-size:13.5px}
.main{flex:1;min-width:0;padding:20px 28px 60px}
@media (max-width:820px){.side{display:none}.main{padding:16px}}
.ph{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}.ph h1{margin:0;font-size:22px}.ph .sub{color:var(--mut);font-size:13px}.sp{flex:1}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.ch{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}.ch h3{margin:0;font-size:15px}
.cb{padding:14px 16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sf);padding:7px 14px;border-radius:7px;white-space:nowrap}
.btn:hover{border-color:var(--fnt)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:4px 10px;font-size:13px}.btn:disabled{opacity:.55;cursor:wait}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-s);color:var(--ok)}.b-warn{background:var(--warn-s);color:var(--warn)}.b-bad{background:var(--bad-s);color:var(--bad)}.b-info{background:var(--info-s);color:var(--info)}.b-mute{background:var(--sf2);color:var(--mut)}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:600;flex:none;background:var(--acc)}
.who-c{display:flex;align-items:center;gap:10px}.who-c small{display:block;color:var(--mut);font-size:12px}
/* list */
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sum button{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:8px 12px}
.sum b{font-size:18px}.sum span{font-size:12.5px;color:var(--mut)}.sum button[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft)}.sum .w b{color:var(--warn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{border:1px solid var(--line);background:var(--sf);border-radius:7px;padding:7px 10px}.tools input{flex:1;min-width:200px;max-width:340px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:900px}
th{font-size:12px;color:var(--mut);font-weight:500;text-align:left;padding:9px 10px;background:var(--sf2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr.ck{cursor:pointer}tr.ck:hover td{background:var(--sf2)}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--info-s);color:var(--info);font-size:13px}
.ln-ok{color:var(--ok);font-size:12.5px;white-space:nowrap}.ln-wait{color:var(--warn);font-size:12.5px}.ln-no{color:var(--fnt);font-size:12.5px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--mut);font-size:13px}
/* profile */
.back{border:0;background:none;color:var(--mut);padding:0;margin-bottom:10px;font-size:13px}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px}.hero h2{margin:0;font-size:20px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.kv{display:grid;grid-template-columns:minmax(120px,160px) minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin:0}.kv dt{color:var(--mut)}.kv dd{margin:0;overflow-wrap:anywhere}
.lbox{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lpic{width:44px;height:44px;border-radius:50%;background:#06C755;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13px}
/* form */
.fl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}@media(max-width:980px){.fl{grid-template-columns:1fr}.toc{display:none!important}}
.toc{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;font-size:13px}.toc a{color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:6px}
.toc a.err{color:var(--bad);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
.f input,.f select{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--sf);color:var(--fg);width:100%}
.f input[readonly]{background:var(--sf2);color:var(--mut)}.f .h{font-size:12px;color:var(--fnt)}.f .er{font-size:12px;color:var(--bad)}
.f.bad input,.f.bad select{border-color:var(--bad);background:var(--bad-s)}.req{color:var(--bad)}
.days{display:flex;gap:6px;flex-wrap:wrap}.days button{width:42px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--sf)}.days button[aria-pressed=true]{background:var(--nav);color:#fff;border-color:var(--nav)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--sf);text-align:left;display:flex;flex-direction:column;gap:4px}.opt b{font-size:14px}.opt span{font-size:12.5px;color:var(--mut)}
.opt[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft)}
.foot{position:sticky;bottom:0;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:14px;box-shadow:0 -6px 18px rgba(13,27,46,.08)}
.alert{padding:8px 12px;border-radius:8px;background:var(--bad-s);color:var(--bad);font-weight:600;margin-bottom:12px}
/* drawer & misc */
.dbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--sf);z-index:41;display:flex;flex-direction:column}.drw .cb{overflow:auto;flex:1}
.toast{position:fixed;right:20px;bottom:20px;background:var(--nav);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;max-width:420px}
.toast.bad{background:var(--bad)}
.loading{display:flex;gap:10px;align-items:center;justify-content:center;padding:48px;color:var(--mut)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#000000,#2B2B2B)}
.login .card{width:min(400px,100%);padding:24px;display:flex;flex-direction:column;gap:12px}
.qr{width:184px;height:184px;flex:none;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
.copy{display:flex;gap:6px}.copy input{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--sf2);font:12px var(--mono)}
.otab{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px}.otab button{border:0;background:none;padding:9px 14px;color:var(--mut);border-bottom:2px solid transparent}.otab button[aria-selected=true]{color:var(--fg);font-weight:600;border-bottom-color:var(--acc)}
.qa{border:0;background:none;color:var(--acc);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:0 0 0 6px}.qa:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="app"><div class="loading"><span class="spin"></span>กำลังโหลด…</div></div>
<div id="ov"></div>
<script>
(function(){
'use strict';
/* ตั้งค่า: บน GitHub Pages ให้กำหนด window.HR_CONFIG = {api:'https://script.google.com/macros/s/…/exec', liffId:'…'} ก่อนสคริปต์นี้ */
var CFG=window.HR_CONFIG||{};var API=CFG.api||'/api';var DEV=/^(127\.0\.0\.1|localhost)$/.test(location.hostname);
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function call(fn){var args=Array.prototype.slice.call(arguments,1);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})}).then(function(r){return r.text()})
   .then(function(t){var j;try{j=JSON.parse(t)}catch(e){throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ')}if(!j.ok){if(j.error==='SESSION_EXPIRED'){store('hr_tok',null);A.tok=null;toast('หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่',1);renderLogin()}throw new Error(j.error)}return j.r})}
function aCall(fn){return call.apply(null,[fn,A.tok].concat(Array.prototype.slice.call(arguments,1)))}
var tT;function toast(m,bad){var t=$('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);clearTimeout(tT);tT=setTimeout(function(){t.remove()},bad?6000:3000)}
function busy(btn,on){if(btn){btn.disabled=on}}
var A={tok:store('hr_tok'),d:null,view:'list',id:null,q:'',dept:'all',chk:'all',line:'all',st:'all',sum:'all',sel:[],page:1,f:null,err:{},otab:'departments'};
var ROLE={employee:'พนักงาน',lead:'หัวหน้าทีม',manager:'ผู้จัดการแผนก',hr:'HR',exec:'ผู้บริหาร',admin:'ผู้ดูแลระบบ'};
var ST={active:['ทำงาน','b-ok'],probation:['ทดลองงาน','b-info'],leave:['ลาระยะยาว','b-warn'],resigned:['ลาออก','b-mute']};
var CHK={office:['Office','ลงเวลาเฉพาะจุดสำนักงาน (GPS)','b-info'],field:['Field','ลงเวลาที่หน้างานตามตารางงาน','b-ok'],both:['Office + Field','สำนักงาน หรือหน้างานตามตาราง','b-warn'],none:['ไม่ต้องลงเวลา','ผู้บริหาร / ยกเว้นการลงเวลา','b-mute']};
var DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
function isHR(){return A.d&&(A.d.me.role==='hr'||A.d.me.role==='admin')}
function org(t,id){var r=(A.d.org[t]||[]).filter(function(x){return x.id===id})[0];return r?r.name:''}
function full(e){return (e.title||'')+e.first_name+' '+e.last_name}
function ini(e){return (e.first_name||'?')[0]+(e.last_name||'')[0]}
function av(e,s){s=s||30;return '<span class="av" style="width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s/2.6)+'px">'+esc(ini(e))+'</span>'}
function chkB(c){return CHK[c]?'<span class="badge '+CHK[c][2]+'">'+CHK[c][0]+'</span>':'<span class="badge b-bad">ยังไม่ระบุ</span>'}
function lineC(e){return e.line==='linked'?'<span class="ln-ok">● เชื่อมแล้ว</span>':e.line==='wait'?'<span class="ln-wait">● รอยืนยัน</span>':'<span class="ln-no">ยังไม่เชื่อม</span>'}
function days(d){d=d||[];var s=d.slice().sort().join(',');return s==='1,2,3,4,5'?'จ.–ศ.':s==='1,2,3,4,5,6'?'จ.–ส.':d.map(function(x){return DOW[x]}).join(' ')}
function wt(e){return e.work_start==='00:00'?'<span class="badge b-mute">ยืดหยุ่น</span>':'<span class="num">'+esc(e.work_start)+'–'+esc(e.work_end)+'</span>'}
function thd(s){if(!s)return '—';var p=s.split('-');return +p[2]+'/'+p[1]+'/'+(+p[0]+543)}
function emp(id){return A.d.employees.filter(function(e){return e.id===id})[0]}

/* ───────── login ───────── */
function renderLogin(){
  $('#app').innerHTML='<div class="login"><div class="card"><div class="brand" style="color:var(--fg);padding:0"><i style="background:var(--nav);color:#fff">PM</i>Push Media HR</div><h1 style="margin:0;font-size:20px">เข้าสู่ระบบหลังบ้าน</h1>'+
   '<button class="btn pri" id="lg-line" style="justify-content:center;background:#06C755;border-color:#06C755">เข้าสู่ระบบด้วย LINE</button>'+
   '<details><summary class="muted" style="cursor:pointer;font-size:13px">ผู้ดูแลระบบ (รหัสผ่าน)</summary><form id="lg-pw" style="display:flex;gap:8px;margin-top:8px"><input id="pw" type="password" autocomplete="current-password" placeholder="รหัสผ่าน" style="flex:1;border:1px solid var(--line);border-radius:7px;padding:8px"><button class="btn">เข้าสู่ระบบ</button></form></details>'+
   (DEV?'<div class="cb" style="background:var(--warn-s);border-radius:8px;font-size:13px"><b>โหมดทดสอบในเครื่อง</b> · เข้าเป็น <button class="btn sm" data-dev="Uhr1|มิ้นท์">HR</button> <button class="btn sm" data-dev="Umgr1|โอ๊ต">ผู้จัดการ</button> <button class="btn sm" data-dev="Ulead1|ต้น">หัวหน้าทีม</button> · รหัส admin: demo1234</div>':'')+
   '<div id="lg-err" class="er" style="color:var(--bad);font-size:13px"></div></div></div>';
  $('#lg-line').onclick=function(){lineLogin()};
  $('#lg-pw').onsubmit=function(ev){ev.preventDefault();var b=ev.submitter;busy(b,1);call('loginAdmin',$('#pw').value).then(function(r){done(r.token)}).catch(function(e){busy(b,0);$('#lg-err').textContent=e.message})};
  $$('[data-dev]').forEach(function(b){b.onclick=function(){var p=b.dataset.dev.split('|');loginWith('dev|'+p[0]+'|'+p[1])}});
}
function lineLogin(){
  if(DEV)return toast('โหมดทดสอบ: เลือกบทบาทจากกล่องสีเหลือง');
  if(!window.liff||!CFG.liffId)return $('#lg-err').textContent='ยังไม่ได้ตั้งค่า LIFF ID';
  liff.init({liffId:CFG.liffId}).then(function(){if(!liff.isLoggedIn())return liff.login({redirectUri:location.href});loginWith(liff.getIDToken())}).catch(function(e){$('#lg-err').textContent=e.message});
}
function loginWith(idt){call('loginLine',idt).then(function(r){if(!r.linked){$('#lg-err').textContent='บัญชี LINE นี้ยังไม่ได้เชื่อมกับพนักงาน ให้เปิดลิงก์เชื่อม LINE จาก HR ก่อน';return}done(r.token)}).catch(function(e){$('#lg-err').textContent=e.message})}
function done(tok){A.tok=tok;store('hr_tok',tok);boot()}
function boot(){if(!A.tok)return renderLogin();$('#app').innerHTML='<div class="loading"><span class="spin"></span>กำลังโหลดข้อมูล…</div>';
  aCall('adminBootstrap').then(function(d){A.d=d;render()}).catch(function(e){if(A.tok)$('#app').innerHTML='<div class="loading">'+esc(e.message)+' <button class="btn" onclick="location.reload()">ลองใหม่</button></div>'})}
function reload(keep){return aCall('adminBootstrap').then(function(d){A.d=d;if(keep!==false)render()})}

/* ───────── shell ───────── */
function render(){
  var me=A.d.me,lr=A.d.linkRequests.length;
  var nav=[['att','ลงเวลาวันนี้'],['lv','การลา'],['list','พนักงาน'],['req','คำขอเชื่อม LINE',lr],['org','โครงสร้างองค์กร']].filter(function(n){return isHR()||n[0]==='list'||n[0]==='att'||n[0]==='lv'});
  var body=A.view==='profile'?vProfile():A.view==='form'?vForm():A.view==='req'?vReq():A.view==='org'?vOrg():A.view==='att'?vAtt():A.view==='lv'?vLv():vList();
  $('#app').innerHTML='<div class="shell"><nav class="side" aria-label="เมนู"><div class="brand"><i>PM</i>'+esc(A.d.company||'Push Media HR')+'</div>'+
   nav.map(function(n){return '<a data-nav="'+n[0]+'" class="'+((A.view===n[0]||(n[0]==='list'&&/profile|form/.test(A.view)))?'on':'')+'">'+n[1]+(n[2]?'<span class="cnt">'+n[2]+'</span>':'')+'</a>'}).join('')+
   '<div class="who">เข้าสู่ระบบเป็น<b>'+esc(me.name)+'</b>'+ROLE[me.role]+'<br><a id="out" style="padding:6px 0;color:#fff;text-decoration:underline">ออกจากระบบ</a></div></nav><main class="main">'+body+'</main></div>';
  $$('[data-nav]').forEach(function(a){a.onclick=function(){go(a.dataset.nav)}});
  $('#out').onclick=function(){call('logout',A.tok);store('hr_tok',null);A.tok=null;renderLogin()};
  ({list:bList,profile:bProfile,form:bForm,req:bReq,org:bOrg,att:bAtt,lv:bLv})[A.view]();
}
function go(v,id){A.view=v;A.id=id||null;if(v!=='form'){A.f=null;A.err={}}closeD();render();scrollTo(0,0)}

/* ───────── ลงเวลาวันนี้ (Phase 2b) ───────── */
var AST={ok:['ปกติ','b-ok'],late:['มาสาย','b-warn'],not_yet:['ยังไม่ลงเวลา','b-bad'],working:['กำลังทำงาน','b-info'],missing_out:['ไม่มีลงเวลาออก','b-warn'],missing_in:['ไม่มีลงเวลาเข้า','b-warn'],leave:['ลา','b-info'],leave_wait:['ลา (รออนุมัติ)','b-warn'],holiday:['วันหยุด','b-mute'],off:['วันหยุด','b-mute'],absent:['ขาดงาน','b-bad']};

     okL.map(function(x){var e=emp(x.id);return '<div style="margin-top:12px"><div style="font-size:13px;margin-bottom:4px"><b>'+esc(e?e.first_name+' '+e.last_name:x.code)+'</b> <span class="faint num">'+esc(x.code)+'</span></div><div class="copy"><input readonly value="'+esc(x.url)+'" aria-label="ลิงก์เชิญ"><button class="btn sm" data-cp>คัดลอก</button></div></div>'}).join('')+
     (bad.length?'<div class="alert" style="margin-top:12px">ข้าม '+bad.length+' คน: '+bad.map(function(x){var e=emp(x.id);return esc((e?e.nickname:x.id)+' ('+x.error+')')}).join(', ')+'</div>':'')+
     (okL.length?'<p class="faint" style="font-size:12.5px">ลิงก์ใช้ได้ถึง '+esc(okL[0].expires_at.slice(0,10))+' ('+A.d.inviteDays+' วัน) · ใช้ได้ครั้งเดียว · กรอกผิด 5 ครั้งพัก 15 นาที · ลิงก์เก่าของคนเดียวกันถูกยกเลิกอัตโนมัติ</p>':'');
    drawer(one?'เชื่อม LINE · '+(emp(one.id)||{}).first_name:'ส่งลิงก์เชื่อม LINE · '+okL.length+' คน',body,'<button class="btn" id="dc">ปิด</button>');$('#dc').onclick=closeD;
    $$('[data-cp]').forEach(function(b){b.onclick=function(){var i=b.previousElementSibling;(navigator.clipboard?navigator.clipboard.writeText(i.value):Promise.reject()).then(function(){toast('คัดลอกลิงก์แล้ว')}).catch(function(){i.select();toast('เลือกข้อความแล้ว กด Ctrl+C')})}});
    A.sel=[];
  }).catch(function(e){closeD();toast(e.message,1)});
}
function unlink(id){var e=emp(id);
  drawer('ยกเลิกการเชื่อม LINE','<p>ยกเลิกการเชื่อม LINE ของ <b>'+esc(full(e))+'</b>?</p><ul style="font-size:13.5px"><li>พนักงานจะใช้แอปไม่ได้จนกว่าจะเชื่อมใหม่</li><li>ประวัติเดิมยังอยู่ครบ</li></ul><label class="f"><span>เหตุผล (บันทึกใน Audit Log) <b class="req">*</b></span><input id="ur" placeholder="เช่น พนักงานเปลี่ยนบัญชี LINE"></label><div id="ue" class="er" style="color:var(--bad);font-size:12px;margin-top:6px"></div>','<button class="btn" id="un">ไม่ยกเลิก</button><button class="btn bad" id="uy">ยกเลิกการเชื่อม</button>');
  $('#un').onclick=closeD;$('#uy').onclick=function(){var b=this;if(!$('#ur').value.trim()){$('#ue').textContent='กรอกเหตุผลก่อน';return}busy(b,1);aCall('unlinkLine',id,$('#ur').value).then(function(){PROF=null;return reload()}).then(function(){closeD();toast('ยกเลิกการเชื่อม LINE แล้ว')}).catch(function(e){busy(b,0);$('#ue').textContent=e.message})};
}

/* ───────── คำขอเชื่อม LINE ───────── */
function vReq(){var L=A.d.linkRequests;
  return '<div class="ph"><div><h1>คำขอเชื่อม LINE</h1><div class="sub">พนักงานที่ลงทะเบียนเองโดยไม่ผ่านลิงก์เชิญ · ตรวจว่าเป็นคนเดียวกันก่อนยืนยัน</div></div></div><section class="card">'+
   (L.length?'<div class="tw"><table style="min-width:640px"><thead><tr><th>พนักงาน</th><th>ชื่อบัญชี LINE</th><th>ส่งเมื่อ</th><th></th></tr></thead><tbody>'+L.map(function(r){return '<tr><td><b>'+esc(r.name)+'</b> <span class="faint num">'+esc(r.code)+'</span></td><td>'+esc(r.line_name)+'</td><td class="num">'+esc((r.at||'').slice(0,16).replace('T',' '))+'</td><td style="text-align:right;white-space:nowrap"><button class="btn sm" data-no="'+r.id+'">ไม่ใช่คนนี้</button> <button class="btn sm ok" data-yes="'+r.id+'">ยืนยัน</button></td></tr>'}).join('')+'</tbody></table></div>'
   :'<div class="loading">ไม่มีคำขอรอยืนยัน</div>')+'</section>'}
function bReq(){$$('[data-yes],[data-no]').forEach(function(b){b.onclick=function(){var ok=!!b.dataset.yes;busy(b,1);aCall('decideLink',b.dataset.yes||b.dataset.no,ok).then(function(){return reload()}).then(function(){toast(ok?'ยืนยันการเชื่อม LINE แล้ว':'ปฏิเสธคำขอแล้ว')}).catch(function(e){busy(b,0);toast(e.message,1)})}})}

/* ───────── โครงสร้างองค์กร ───────── */
var OT={departments:['แผนก',[['code','รหัส'],['name','ชื่อแผนก']]],teams:['ทีม',[['code','รหัส'],['name','ชื่อทีม'],['department_id','แผนก'],['min_staff','ขั้นต่ำคน/วัน'],['works_saturday','ทำงานวันเสาร์']]],positions:['ตำแหน่ง',[['name','ชื่อตำแหน่ง'],['department_id','แผนก']]],gps_sites:['จุดลงเวลา',[['name','ชื่อจุด'],['lat','ละติจูด'],['lng','ลองจิจูด'],['radius_m','รัศมี (ม.)']]]};
function vOrg(){var t=A.otab,def=OT[t],rows=A.d.org[t];
  var cell=function(r,k){return k==='department_id'?esc(org('departments',r[k])||'—'):k==='works_saturday'?(r[k]==='TRUE'?'✓':'—'):esc(r[k]||'—')};
  return '<div class="ph"><div><h1>โครงสร้างองค์กร</h1><div class="sub">ใช้ในฟอร์มพนักงาน · ปิดใช้งานแทนการลบ เพื่อไม่ให้ข้อมูลเดิมเสีย</div></div><span class="sp"></span><button class="btn pri" id="oa">+ เพิ่ม'+def[0]+'</button></div>'+
   '<div class="otab" role="tablist">'+Object.keys(OT).map(function(k){return '<button role="tab" data-ot="'+k+'" aria-selected="'+(k===t)+'">'+OT[k][0]+' <span class="faint">'+A.d.org[k].filter(function(x){return x.active!=='FALSE'}).length+'</span></button>'}).join('')+'</div>'+
   '<section class="card"><div class="tw"><table style="min-width:600px"><thead><tr>'+def[1].map(function(c){return '<th>'+c[1]+'</th>'}).join('')+'<th>สถานะ</th><th></th></tr></thead><tbody>'+
   rows.map(function(r){return '<tr>'+def[1].map(function(c){return '<td>'+cell(r,c[0])+'</td>'}).join('')+'<td>'+(r.active==='FALSE'?'<span class="badge b-mute">ปิดใช้งาน</span>':'<span class="badge b-ok">ใช้งาน</span>')+'</td><td style="text-align:right;white-space:nowrap"><button class="btn sm" data-oe="'+r.id+'">แก้ไข</button> <button class="btn sm" data-oo="'+r.id+'">'+(r.active==='FALSE'?'เปิดใช้':'ปิดใช้')+'</button></td></tr>'}).join('')+'</tbody></table></div></section>'}
function bOrg(){$$('[data-ot]').forEach(function(b){b.onclick=function(){A.otab=b.dataset.ot;render()}});$('#oa').onclick=function(){orgForm(null)};
  $$('[data-oe]').forEach(function(b){b.onclick=function(){orgForm(A.d.org[A.otab].filter(function(r){return r.id===b.dataset.oe})[0])}});
  $$('[data-oo]').forEach(function(b){b.onclick=function(){var r=A.d.org[A.otab].filter(function(x){return x.id===b.dataset.oo})[0];busy(b,1);aCall('setOrgActive',A.otab,r.id,r.active==='FALSE').then(function(){return reload()}).catch(function(e){busy(b,0);toast(e.message,1)})}})}
function orgForm(r){var t=A.otab,def=OT[t];r=r||{};
  var input=function(c){var k=c[0];if(k==='department_id')return '<select id="o_'+k+'"><option value="">— ไม่ระบุ —</option>'+A.d.org.departments.filter(function(d){return d.active!=='FALSE'}).map(function(d){return '<option value="'+d.id+'"'+(r[k]===d.id?' selected':'')+'>'+esc(d.name)+'</option>'}).join('')+'</select>';
    if(k==='works_saturday')return '<select id="o_'+k+'"><option value="FALSE">ไม่ทำงาน</option><option value="TRUE"'+(r[k]==='TRUE'?' selected':'')+'>ทำงาน</option></select>';return '<input id="o_'+k+'" value="'+esc(r[k]||'')+'"'+(/lat|lng|radius|min_staff/.test(k)?' inputmode="decimal"':'')+'>'};
  drawer((r.id?'แก้ไข':'เพิ่ม')+def[0],'<form id="of" style="display:flex;flex-direction:column;gap:12px">'+def[1].map(function(c){return '<label class="f" id="w_'+c[0]+'"><span>'+c[1]+'</span>'+input(c)+'<span class="er"></span></label>'}).join('')+(t==='gps_sites'?'<p class="faint" style="font-size:12.5px;margin:0">คัดลอกพิกัดจาก Google Maps (คลิกขวาที่จุด → ตัวเลขแรกคือละติจูด)</p>':'')+'</form>','<button class="btn" id="oc">ยกเลิก</button><button class="btn pri" id="os">บันทึก</button>');
  $('#oc').onclick=closeD;$('#os').onclick=function(){var b=this,item={id:r.id};def[1].forEach(function(c){item[c[0]]=$('#o_'+c[0]).value});busy(b,1);
    aCall('saveOrgItem',t,item).then(function(res){if(!res.ok){busy(b,0);$$('#of .f').forEach(function(w){w.classList.remove('bad');$('.er',w).textContent=''});Object.keys(res.errors).forEach(function(k){var w=$('#w_'+k);if(w){w.classList.add('bad');$('.er',w).textContent=res.errors[k]}});return}
      return reload().then(function(){closeD();toast('บันทึกแล้ว')})}).catch(function(e){busy(b,0);toast(e.message,1)})}}

boot();
})();
</script>
