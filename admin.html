<style>
/* สี Push Media ขาว–ดำ ตามโลโก้ (22 ต.ค. 2569) · สีสถานะ ok/warn/bad คงไว้ */
:root{--nav:#0B0B0B;--nav2:#1F1F1F;--nav-ink:#C8C8C8;--acc:#111111;--acc-soft:#EDEDED;--bg:#F4F4F4;--sf:#FFFFFF;--sf2:#F8F8F8;--line:#E3E3E3;
 --fg:#141414;--mut:#5F5F5F;--fnt:#909090;--ok:#1A8A4A;--ok-s:#E3F4EA;--warn:#B26A00;--warn-s:#FFF3DC;--bad:#C0392B;--bad-s:#FCE8E6;--info:#3A3A3A;--info-s:#EDEDED;
 --sans:"IBM Plex Sans Thai",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--r:10px}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--mut)}.faint{color:var(--fnt)}
/* shell */
.shell{display:flex;min-height:100%}
.side{z-index:40;width:232px;flex:none;background:var(--nav);color:var(--nav-ink);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;padding:4px 8px 16px}
.brand i{width:30px;height:30px;border-radius:8px;background:#fff;color:var(--nav);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:inherit;text-decoration:none;cursor:pointer}
.side a:hover{background:var(--nav2)}.side a.on{background:var(--nav2);color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.side a .cnt{margin-left:auto;background:var(--warn);color:#fff;font-size:11px;border-radius:99px;padding:0 7px}
.side .who{margin-top:auto;padding:10px;font-size:12.5px}.side .who b{display:block;color:#fff;font-size:13.5px}
.main{flex:1;min-width:0;padding:20px 28px 60px}
@media (max-width:820px){.side{display:none}.main{padding:16px}}
.ph{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px}.ph h1{margin:0;font-size:22px}.ph .sub{color:var(--mut);font-size:13px}.sp{flex:1}
.card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.ch{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}.ch h3{margin:0;font-size:15px}
.cb{padding:14px 16px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sf);padding:7px 14px;border-radius:7px;white-space:nowrap}
.btn:hover{border-color:var(--fnt)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:4px 10px;font-size:13px}.btn:disabled{opacity:.55;cursor:wait}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
/* ป้ายอธิบายเมื่อชี้ (28 ต.ค. 2569): แทน title ของเบราว์เซอร์ทั้งระบบ · เล็ก · ไม่ล้นจอ */
.tipx{position:fixed;z-index:200;max-width:300px;text-wrap:balance;padding:6px 10px;border-radius:8px;background:#1C1C1C;color:#fff;font-size:12px;line-height:1.45;font-weight:500;box-shadow:0 6px 18px rgba(0,0,0,.18);pointer-events:none;opacity:0;transform:translateY(2px);transition:opacity .12s,transform .12s}.tipx.on{opacity:1;transform:none}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 9px;border-radius:99px;font-weight:500;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-s);color:var(--ok)}.b-warn{background:var(--warn-s);color:var(--warn)}.b-bad{background:var(--bad-s);color:var(--bad)}.b-info{background:var(--info-s);color:var(--info)}.b-mute{background:var(--sf2);color:var(--mut)}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:600;flex:none;background:var(--acc)}
.who-c{display:flex;align-items:center;gap:10px}.who-c small{display:block;color:var(--mut);font-size:12px}
/* list */
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sum button{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--sf);border-radius:8px;padding:8px 12px}
.sum b{font-size:18px}.sum span{font-size:12.5px;color:var(--mut)}.sum button[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft)}.sum .w b{color:var(--warn)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{border:1px solid var(--line);background:var(--sf);border-radius:7px;padding:7px 10px}.tools input{flex:1;min-width:200px;max-width:340px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:900px}
th{font-size:12px;color:var(--mut);font-weight:500;text-align:left;padding:9px 10px;background:var(--sf2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr.ck{cursor:pointer}tr.ck:hover td{background:var(--sf2)}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;background:var(--info-s);color:var(--info);font-size:13px}
.ln-ok{color:var(--ok);font-size:12.5px;white-space:nowrap}.ln-wait{color:var(--warn);font-size:12.5px}.ln-no{color:var(--fnt);font-size:12.5px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--mut);font-size:13px}
/* profile */
.back{border:0;background:none;color:var(--mut);padding:0;margin-bottom:10px;font-size:13px}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px}.hero h2{margin:0;font-size:20px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.kv{display:grid;grid-template-columns:minmax(120px,160px) minmax(0,1fr);gap:8px 12px;font-size:13.5px;margin:0}.kv dt{color:var(--mut)}.kv dd{margin:0;overflow-wrap:anywhere}
.lbox{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lpic{width:44px;height:44px;border-radius:50%;background:#06C755;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13px}
/* form */
.fl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:20px;align-items:start}@media(max-width:980px){.fl{grid-template-columns:1fr}.toc{display:none!important}}
.toc{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;font-size:13px}.toc a{color:var(--mut);text-decoration:none;padding:6px 10px;border-radius:6px}
.toc a.err{color:var(--bad);font-weight:600}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--sf);color:var(--fg);width:100%}
.f input[readonly]{background:var(--sf2);color:var(--mut)}.f .h{font-size:12px;color:var(--fnt)}.f .er{font-size:12px;color:var(--bad)}
.f.bad input,.f.bad select{border-color:var(--bad);background:var(--bad-s)}.req{color:var(--bad)}
.days{display:flex;gap:6px;flex-wrap:wrap}.days button{width:42px;height:34px;border-radius:7px;border:1px solid var(--line);background:var(--sf)}.days button[aria-pressed=true]{background:var(--nav);color:#fff;border-color:var(--nav)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px;background:var(--sf);text-align:left;display:flex;flex-direction:column;gap:4px}.opt b{font-size:14px}.opt span{font-size:12.5px;color:var(--mut)}
.opt[aria-pressed=true]{border-color:var(--acc);background:var(--acc-soft)}
.foot{position:sticky;bottom:0;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:14px;box-shadow:0 -6px 18px rgba(13,27,46,.08)}
.alert{padding:8px 12px;border-radius:8px;background:var(--bad-s);color:var(--bad);font-weight:600;margin-bottom:12px}
/* drawer & misc */
.dbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.drw{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);transition:width .2s;background:var(--sf);z-index:41;display:flex;flex-direction:column}.drw .cb{overflow:auto;flex:1}
.toast{position:fixed;right:20px;bottom:20px;background:var(--nav);color:#fff;padding:10px 16px;border-radius:8px;z-index:60;max-width:420px}
.toast.bad{background:var(--bad)}
.loading{display:flex;gap:10px;align-items:center;justify-content:center;padding:48px;color:var(--mut)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.login{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;background:#F1F1F1;color:#141414;display:flex;flex-direction:column;align-items:center;padding:28px 24px 56px}
.lg-wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;z-index:0;pointer-events:none}
.lg-top{position:relative;z-index:1;width:min(960px,100%);display:flex;justify-content:flex-end;margin-bottom:clamp(20px,6vh,70px)}.lg-top img{height:46px;width:auto}
.lg-intro{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none}.lg-intro svg{width:min(560px,78vw);height:auto;transform-origin:0 0;overflow:visible}
.login.intro .lg-top img{opacity:0}.login.intro .lg-card,.login.intro .lg-foot,.login.intro .lg-top-sp{animation:lgUp .7s cubic-bezier(.2,.8,.2,1) 2.45s both}.login.intro .lg-wave{animation:lgWave .9s cubic-bezier(.2,.8,.2,1) 2.2s both}
/* หน้าเข้าสู่ระบบแบบคอลัมน์เดียว (ไม่มีช่องรหัสผู้ดูแล) */
.login.one .lg-top,.login.one .lg-card{width:min(520px,100%)}.login.one .lg-card{padding:44px 44px 30px;gap:28px}.login.one .lg-top{justify-content:center}.login.one .lg-cols{display:block}.login.one .lg-h{text-align:center}.login.one .lg-h h1{font-size:clamp(26px,3vw,34px)}.login.one .lg-h h1 span{display:block;font-size:.62em;font-weight:500;color:#6B6B6B;margin-bottom:2px}.login.one .lg-h p{margin-top:10px}.login.one .lg-note,.login.one .lg-hint{text-align:center}.login.one .lg-btn{height:52px}.login.one .lg-foot{text-align:center}
@media(max-width:700px){.login.one .lg-card{padding:28px 22px 22px;gap:22px}}
/* ── หน้าเข้าสู่ระบบแบบแบ่ง 2 ฝั่ง ── */
.login.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(400px,.9fr);align-items:center;background:#fff;padding:0;min-height:100vh;min-height:100dvh}
.login.split .lg-side{display:flex;justify-content:center;padding:40px 48px;position:relative;z-index:1}
.login.split .lg-card{width:min(400px,100%);background:transparent;box-shadow:none;padding:0;border-radius:0;gap:18px}
.login.split .lg-top{width:auto;justify-content:center;margin:0 0 18px}.login.split .lg-top img{height:40px}
.login.split .lg-h{text-align:center}.login.split .lg-h h1{font-size:clamp(30px,2.6vw,38px);letter-spacing:-.015em}.login.split .lg-h p{margin:6px 0 0;color:#8A8A8A;font-size:15px}
.login.split .lg-btn{height:54px;border-radius:12px;font-size:16px}.login.split .lg-hint{text-align:center}
.lg-or2{display:flex;align-items:center;gap:14px;color:#B5B5B5;font-size:13px;margin:2px 0}.lg-or2 i{flex:1;height:1px;background:#ECECEC}
.lg-first{text-align:center;font-size:14px;color:#8A8A8A;line-height:1.6}.lg-first b{color:#141414;font-weight:600}
.login.split .lg-foot{text-align:center;color:#B0B0B0;font-size:12.5px}
.lg-art{position:relative;height:100%;min-height:640px;display:grid;place-items:center;overflow:hidden;background:#FAFAFA}
.lg-dots{position:absolute;width:150px;height:110px;background:radial-gradient(#DADADA 1.6px,transparent 1.8px) 0 0/15px 15px}.lg-dots.d1{left:7%;bottom:9%}.lg-dots.d2{right:6%;top:7%;width:110px;height:150px}
.lg-chev{position:absolute;width:130px;color:#F0F0F0}.lg-chev.c1{top:9%;left:42%}.lg-chev.c2{bottom:7%;right:12%;width:160px}.lg-chev.c3{top:46%;left:4%;width:80px}
.lg-orb{position:relative;width:600px;height:600px;flex:none;transform:scale(var(--lgs,1))}
.lg-ring{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid #141414;transform:translate(-50%,-50%)}.lg-ring.r1{width:640px;height:640px;opacity:.07}.lg-ring.r2{width:500px;height:500px;opacity:.1}.lg-ring.r3{width:370px;height:370px;opacity:.13}   /* 29 ต.ค. 2569: กว้างขึ้น + จางลง ไม่แย่งซีนมือถือ */
.lg-ping{position:absolute;left:50%;top:50%;width:640px;height:640px;margin:-320px 0 0 -320px;border-radius:50%;background:radial-gradient(circle,rgba(20,20,20,.07),rgba(20,20,20,0) 70%);animation:lgPing 3.6s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes lgPing{from{transform:scale(.25);opacity:1}to{transform:scale(1);opacity:0}}
.lg-pin{position:absolute;left:50%;top:50%;width:24px;height:30px;margin:-30px 0 0 -12px;transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1))}
.lg-pin svg{display:block;width:100%;height:100%;animation:lgBob 3s ease-in-out var(--d) infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
@keyframes lgBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lg-ph{position:absolute;left:50%;top:50%;width:250px;height:512px;margin:-256px 0 0 -125px;border:9px solid #111;border-radius:44px;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.22),0 0 0 1.5px #3a3a3a;padding:12px 18px 0;display:flex;flex-direction:column;gap:12px;overflow:hidden;font-size:11px;color:#141414}
.ph-sb{display:flex;align-items:center;justify-content:space-between;height:22px;font-size:11px}.ph-notch{width:78px;height:22px;border-radius:12px;background:#111}.ph-ic{display:flex;gap:2px;align-items:flex-end}.ph-ic i{width:3px;background:#111;border-radius:1px}.ph-ic i:nth-child(1){height:5px}.ph-ic i:nth-child(2){height:7px}.ph-ic i:nth-child(3){height:9px}

.ph-me{position:absolute;left:50%;top:50%;width:20px;height:25px;margin:-25px 0 0 -10px}.ph-me svg{width:100%;height:100%}

.ph-t{text-align:center}.ph-t b{display:block;font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.15}.ph-t small{color:#1A8A4A;font-size:10.5px;font-weight:600}
.ph-btn{height:36px;border-radius:10px;background:#141414;color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px;margin-top:auto}
.ph-or{display:flex;align-items:center;gap:8px;color:#C2C2C2;font-size:9px}.ph-or i{flex:1;height:1px;background:#EEE}
.ph-btn2{height:34px;border-radius:10px;border:1px solid #E3E3E3;display:grid;place-items:center;font-weight:600;font-size:11.5px}
.ph-home{display:block;width:96px;height:4px;border-radius:4px;background:#111;margin:4px auto 8px}
/* มือถือในหน้าเข้าสู่ระบบ · หน้าลงเวลาแบบแอปจริง + แผนที่แบบ A (29 ต.ค. 2569) · วนทุก 6 วิ */
.lg-ph.pa{padding:0;gap:0}.lg-ph.pa .ph-sb{padding:12px 16px 0;height:34px;flex:none}
.pa-hd{position:relative;text-align:center;font-weight:700;font-size:11.5px;padding:6px 0 7px;border-bottom:1px solid #EFEFEF;flex:none}.pa-hd span{position:absolute;left:12px;top:1px;font-size:17px;font-weight:400}
.pa-tm{text-align:center;padding:7px 0 8px;border-bottom:1px solid #EFEFEF;flex:none}.pa-tm small{display:block;font-size:9.5px;color:#6B6B6B}
.pa-tm b{display:block;font-size:30px;line-height:1.1;font-weight:700;color:#1A8A4A;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.pa-tm em{font-style:normal;font-size:9px;color:#1A8A4A}
.pa-bd{padding:8px 12px 0;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}

.pa-sh b{display:block;font-size:9.5px;color:#141414;margin-top:2px}.pa-sh i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto}
.pa-sh .s1{background:#F59E0B;box-shadow:inset 0 0 0 4px #FDE7C2}.pa-sh .s2{background:#FCE3DA;box-shadow:inset 0 -6px 0 #F97316}.pa-sh .s3{background:#E7E9FB;box-shadow:inset 4px -2px 0 #6366F1}
